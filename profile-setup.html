<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Setup - FilthyDreams</title>
  <link rel="stylesheet" href="../css/profile-setup.css">
</head>
<body>

<div class="profile-container">
  <h1>Set up your profile</h1>

  <div class="avatar-section">
    <img id="avatarPreview" src="./default-avatar.png" alt="Avatar">
    <input type="file" id="avatarInput" accept="image/*">
  </div>

  <form id="profileForm">
    <input type="text" id="name" placeholder="Full Name" required>
    <input type="email" id="email" placeholder="Email" required>
    <input type="text" id="country" placeholder="Country" required>
    <button type="submit" class="btn primary">Save Profile</button>
  </form>
</div>

<script type="module" src="../js/env.js"></script>
<script type="module" src="./profile-setup.js"></script>
</body>
</html>
