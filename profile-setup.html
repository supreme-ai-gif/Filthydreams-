<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Setup - FilthyDreams</title>
  <link rel="stylesheet" href="../css/profile-setup.css">
</head>
<body>

  <div class="profile-container">
    <h1>Complete Your Profile</h1>
    <p>Please fill in the details to continue to the store</p>

    <form id="profileForm" class="profile-form">
      <label for="name">Full Name</label>
      <input type="text" id="name" placeholder="John Doe" required>

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="example@email.com" required>

      <label for="country">Country</label>
      <input type="text" id="country" placeholder="USA" required>

      <button type="submit" class="btn save-btn">Save Profile</button>
    </form>
  </div>

  <script type="module" src="./profile-setup.js"></script>
</body>
</html>
