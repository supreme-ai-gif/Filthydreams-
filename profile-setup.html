<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Complete Profile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="../css/profile-setup.css" />
</head>
<body>

  <div class="profile-wrapper">
    <div class="profile-card">
      <h1>Complete Your Profile</h1>
      <p class="subtitle">Just a few more details to continue</p>

      <form id="profileForm">
        <label>
          Full Name
          <input type="text" id="name" required />
        </label>

        <label>
          Email Address
          <input type="email" id="email" required />
        </label>

        <label>
          Country
          <input type="text" id="country" required />
        </label>

        <button type="submit">Save Profile</button>
      </form>

      <p class="note">You can update this later in your account.</p>
    </div>
  </div>

  <script type="module" src="./js/env.js"></script>
  <script type="module" src="./profile-setup.js"></script>
</body>
</html>
