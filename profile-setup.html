<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Setup - FilthyDreams</title>
  <link rel="stylesheet" href="./profile-setup.css">
</head>
<body>

<div class="setup-container">
  <h1>Complete Your Profile</h1>
  <form id="profileSetupForm">
    <div class="form-group">
      <label for="name">Full Name</label>
      <input type="text" id="name" placeholder="Enter your name" required>
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Enter your email" required>
    </div>

    <div class="form-group">
      <label for="country">Country</label>
      <input type="text" id="country" placeholder="Enter your country" required>
    </div>

    <button type="submit" class="btn">Save Profile</button>
  </form>
</div>

<script src="./profile-setup.js" type="module"></script>
</body>
</html>
