<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setup Your Profile | FilthyDreams</title>
  <link rel="stylesheet" href="./css/profile-setup.css">
</head>
<body>
  <div class="setup-container">
    <h1>Complete Your Profile</h1>

    <form id="profileForm">
      <!-- Avatar -->
      <div class="avatar-wrapper">
        <img id="avatarPreview" src="./assets/default-avatar.png" alt="Avatar">
        <input type="file" id="avatarInput" accept="image/*">
      </div>

      <!-- Name -->
      <input type="text" id="name" placeholder="Full Name" required>

      <!-- Email -->
      <input type="email" id="email" placeholder="Email" required>

      <!-- Country -->
      <input type="text" id="country" placeholder="Country" required>

      <button type="submit" class="btn primary">Save Profile</button>
    </form>
  </div>

  <script type="module" src="../js/env.js"></script>
  <script type="module" src="./profile-setup.js"></script>
</body>
</html>
