<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FilthyDreams Store</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="./store.css">
</head>
<body>

<!-- OVERLAY -->
<div id="overlay" class="overlay"></div>

<!-- HEADER -->
<header class="store-header">
  <button id="menuBtn" class="menu-btn">☰</button>
  <h1 class="store-logo">FilthyDreams</h1>
  <input id="searchBar" type="text" placeholder="Search products...">
</header>

<!-- SIDEBAR -->
<aside id="sidebar" class="sidebar">
  <div class="sidebar-profile">
    <div id="avatar" class="avatar"></div>
    <h3 id="profileName">User</h3>
    <p id="profileEmail"></p>
  </div>

  <ul class="sidebar-links">
    <li id="profileBtn">Account Profile</li>
    <li id="cartBtn">Cart</li>
    <li id="logoutBtn">Logout</li>
  </ul>
</aside>

<!-- TABS -->
<nav id="tabsNav" class="tabs"></nav>

<!-- PRODUCTS -->
<main id="productsContainer" class="products-grid"></main>

<script type="module" src="../js/env.js"></script>
<script type="module" src="./store-ui.js"></script>
</body>
</html>
