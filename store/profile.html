<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Profile • FilthyDreams</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="./profile.css">
</head>
<body>

<header class="profile-header">
  <button id="backBtn">← Store</button>
  <h1>My Profile</h1>
</header>

<main class="profile-card">
  <div class="avatar">
    <span>👤</span>
  </div>

  <div class="info">
    <div class="row">
      <label>Username</label>
      <p id="username"></p>
    </div>

    <div class="row">
      <label>Email</label>
      <p id="email"></p>
    </div>

    <div class="row">
      <label>Country</label>
      <p id="country"></p>
    </div>
  </div>

  <button id="logoutBtn" class="logout">Logout</button>
</main>

<script src="./profile.js"></script>
</body>
</html>
