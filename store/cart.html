<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FilthyDreams Cart</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="./cart.css">
</head>
<body>
  <header class="store-header">
    <h1 class="store-logo">FilthyDreams Cart</h1>
    <div class="cart-header-buttons">
      <button id="backBtn" class="btn secondary">← Back to Store</button>
    </div>
  </header>

  <main id="cartContainer" class="cart-grid">
    <!-- Cart items will load here -->
  </main>

  <footer class="cart-footer">
    <p>Total: $<span id="cartTotal">0</span></p>
    <button id="checkoutBtn" class="btn primary">Checkout</button>
  </footer>

  <script type="module" src="../js/env.js"></script>
  <script type="module" src="./cart.js"></script>
</body>
</html>
