<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FilthyDreams Login/Register</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/main.css">
  <style>
    /* Minimal login/register page CSS */
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #f6f6f6;
      font-family: "Segoe UI", sans-serif;
    }
    .auth-container {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.1);
      width: 320px;
    }
    h1 { text-align: center; color: orange; margin-bottom: 20px; }
    input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 10px; border: 1px solid #ccc; }
    button { width: 100%; padding: 12px; background: orange; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }
    button:hover { background: #ff9500; }
    .toggle-link { text-align: center; margin-top: 10px; font-size: 14px; cursor: pointer; color: #555; }
  </style>
</head>
<body>

<div class="auth-container">
  <h1>FilthyDreams</h1>

  <!-- LOGIN FORM -->
  <form id="loginForm">
    <input type="text" id="loginUsername" placeholder="Username" required>
    <input type="password" id="loginPassword" placeholder="Password" required>
    <button type="submit">Login</button>
    <p class="toggle-link" id="showRegister">Don't have an account? Register</p>
  </form>

  <!-- REGISTER FORM -->
  <form id="registerForm" style="display:none;">
    <input type="text" id="regUsername" placeholder="Username" required>
    <input type="password" id="regPassword" placeholder="Password" required>
    <button type="submit">Register</button>
    <p class="toggle-link" id="showLogin">Already have an account? Login</p>
  </form>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const SUPABASE_URL = window.__ENV__.SUPABASE_URL;
const SUPABASE_ANON_KEY = window.__ENV__.SUPABASE_ANON_KEY;
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const loginForm = document.getElementById("loginForm");
const registerForm = document.getElementById("registerForm");

document.getElementById("showRegister").addEventListener("click", () => {
  loginForm.style.display = "none";
  registerForm.style.display = "block";
});
document.getElementById("showLogin").addEventListener("click", () => {
  registerForm.style.display = "none";
  loginForm.style.display = "block";
});

// -------- REGISTER --------
registerForm.addEventListener("submit", async e => {
  e.preventDefault();
  const username = document.getElementById("regUsername").value.trim();
  const password = document.getElementById("regPassword").value.trim();

  if (!username || !password) return alert("Enter username and password");

  // Check if username exists
  const { data: existing } = await supabase.from("users").select("id").eq("username", username).single();
  if (existing) return alert("Username already exists");

  // Insert new user
  const { data, error } = await supabase.from("users").insert({ username, password }).select().single();
  if (error || !data) return alert("Failed to register");

  // Save userId in localStorage
  localStorage.setItem("userId", data.id);
  localStorage.setItem("username", data.username);

  // Redirect to profile setup
  location.href = "./profile-setup.html";
});

// -------- LOGIN --------
loginForm.addEventListener("submit", async e => {
  e.preventDefault();
  const username = document.getElementById("loginUsername").value.trim();
  const password = document.getElementById("loginPassword").value.trim();

  if (!username || !password) return alert("Enter username and password");

  // Admin check
  if (username === "admin" && password === "1234") {
    localStorage.setItem("isAdmin", "true");
    location.href = "../admin/admin.html";
    return;
  }

  const { data, error } = await supabase.from("users").select("*").eq("username", username).eq("password", password).single();
  if (error || !data) return alert("Invalid credentials");

  localStorage.setItem("userId", data.id);
  localStorage.setItem("username", data.username);
  localStorage.removeItem("isAdmin");

  // Redirect to store
  location.href = "../store/store.html";
});
</script>

</body>
</html>
