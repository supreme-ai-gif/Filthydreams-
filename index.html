<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FilthyDreams</title>
  <link rel="stylesheet" href="./css/main.css">
</head>
<body>

  <div class="auth-container" id="authContainer">
    <!-- LOGO -->
    <h1 class="logo">
      <span class="letter-f">F</span>
      <span class="rest-name">ilthyDreams</span>
    </h1>

    <!-- LOGIN FORM (VISIBLE INITIALLY) -->
    <form id="loginForm" class="form">
      <input type="text" id="loginUsername" placeholder="Username" required>
      <input type="password" id="loginPassword" placeholder="Password" required>
      <button type="submit" class="btn primary">Login</button>
      <p class="switch">Don't have an account? <a href="#" id="showRegister">Register</a></p>
    </form>

    <!-- REGISTER FORM (HIDDEN INITIALLY) -->
    <form id="registerForm" class="form hidden">
      <input type="text" id="registerUsername" placeholder="Username" required>
      <input type="password" id="registerPassword" placeholder="Password" required>
      <button type="submit" class="btn primary">Register</button>
      <p class="switch">Already have an account? <a href="#" id="showLogin">Login</a></p>
    </form>
  </div>

  <!-- ENV + JS -->
  <script type="module" src="./js/env.js"></script>
  <script type="module" src="./index.js"></script>
</body>
</html>
