<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FilthyDreams Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../css/main.css" />
</head>

<body class="admin-body">

  <!-- TOP BAR -->
  <header class="admin-top">
    <div class="brand">
      <span class="logo">F</span>
      <span class="name">FilthyDreams</span>
      <small>Admin</small>
    </div>
    <button id="logoutBtn" class="ghost-btn">Logout</button>
  </header>

  <!-- ACTIONS -->
  <section class="admin-actions">
    <button id="createTabBtn" class="primary-btn">+ Create Tab</button>
    <button id="postProductBtn" class="primary-btn">+ Post Product</button>
    <button id="settingsBtn" class="outline-btn">Account</button>
  </section>

  <!-- TABS -->
  <section class="admin-tabs" id="adminTabs">
    <!-- dynamic -->
  </section>

  <!-- MAIN -->
  <main class="admin-layout">
    <section class="admin-products" id="adminProducts">
      <!-- products -->
    </section>

    <aside class="admin-panel" id="adminPanel">
      <p class="muted">Select an action</p>
    </aside>
  </main>

  <script src="../js/env.js"></script>
  <script type="module" src="../js/admin.js"></script>
</body>
</html>
