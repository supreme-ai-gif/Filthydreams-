<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Dashboard | FilthyDreams</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>

<header class="admin-header">
  <h1>Welcome back, <span>Admin</span></h1>
  <button id="logoutBtn" class="logout">Logout</button>
</header>

<section class="admin-cards">
  <div class="card">
    <div class="card-title">📦 Products</div>
    <strong id="productCount">0</strong>
  </div>
  <div class="card">
    <div class="card-title">👀 Views</div>
    <strong id="viewCount">0</strong>
  </div>
  <div class="card">
    <div class="card-title">📁 Tabs</div>
    <strong id="tabCount">0</strong>
  </div>
</section>

<section class="admin-actions">
  <button id="createTabBtn">➕ Create Tab</button>
  <button id="postProductBtn">📤 Post Product</button>
  <button id="settingsBtn">⚙️ Account Settings</button>
</section>

<!-- ADMIN TABS -->
<section class="admin-tabs" id="adminTabs"></section>

<!-- PRODUCTS GRID -->
<section class="admin-products" id="adminProducts"></section>

<!-- DYNAMIC PANEL -->
<section class="admin-panel" id="adminPanel">
  <p class="placeholder">Select a tab or product</p>
</section>

<script src="../js/env.js"></script>
<script type="module" src="admin.js"></script>
</body>
</html>
