<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FilthyDreams Store</title>
<link rel="stylesheet" href="./main.css">
</head>
<body>

<!-- Logo animation at center -->
<section class="logo-section">
  <div class="logo-container">
    <div class="logo">F</div>
    <div class="name">ilthyDreams</div>
  </div>
</section>

<!-- Login / Register buttons -->
<section class="auth-buttons">
  <button id="loginBtn" class="btn primary">Login</button>
  <button id="registerBtn" class="btn outline">Register</button>
</section>

<!-- Main store content (hidden until login) -->
<main id="storeContent" style="display:none;">
  <header class="store-header">
    <div class="search-container">
      <input type="text" id="searchInput" placeholder="Search products...">
    </div>
    <button id="navBtn" class="btn ghost">☰</button>
  </header>

  <nav class="side-nav" id="sideNav">
    <ul>
      <li id="cartLink">Cart</li>
      <li id="profileLink">Profile</li>
      <li id="logoutLink">Logout</li>
    </ul>
  </nav>

  <section class="tabs" id="storeTabs"></section>

  <section class="products" id="productsGrid">
    <p class="muted">No products yet</p>
  </section>
</main>

<!-- Env.js in js folder -->
<script src="./js/env.js"></script>
<script type="module" src="./store.js"></script>

</body>
</html>
