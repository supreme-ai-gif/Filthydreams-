<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FilthyDreams Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../css/main.css" />
</head>
<body class="admin-body">

  <header class="admin-header">
    <h1>FilthyDreams <span>Admin</span></h1>
    <button id="logoutBtn">Logout</button>
  </header>

  <section class="admin-actions">
    <button id="createTabBtn">Create Tab</button>
    <button id="postProductBtn">Post Product</button>
    <button id="settingsBtn">Account Settings</button>
  </section>

  <section class="admin-tabs" id="adminTabs">
    <!-- Tabs load here -->
  </section>

  <main class="admin-main">
    <section class="admin-products" id="adminProducts">
      <!-- Products load here -->
    </section>

    <aside class="admin-panel" id="adminPanel">
      <p class="placeholder">Select an action</p>
    </aside>
  </main>

  <!-- ENV MUST COME FIRST -->
  <script src="../js/env.js"></script>
  <script type="module" src="../js/admin.js"></script>
</body>
</html>
