<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FilthyDreams Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="admin.css" />
</head>

<body class="admin-body">

  <!-- TOP BAR -->
  <header class="admin-header">
    <div class="admin-brand">
      <div class="logo">F</div>
      <div>
        <h1>FilthyDreams</h1>
        <small>Admin Dashboard</small>
      </div>
    </div>

    <button id="logoutBtn" class="btn ghost">Logout</button>
  </header>

  <!-- ACTION BAR -->
  <section class="admin-actions">
    <button id="createTabBtn" class="btn primary">Create Tab</button>
    <button id="postProductBtn" class="btn primary">Post Product</button>
    <button id="settingsBtn" class="btn outline">Account</button>
  </section>

  <!-- TAB NAVIGATION -->
  <nav class="admin-tabs" id="adminTabs">
    <!-- Tabs injected here -->
  </nav>

  <!-- MAIN CONTENT -->
  <main class="admin-content">
    <section class="admin-products" id="adminProducts">
      <!-- Products -->
    </section>

    <aside class="admin-panel" id="adminPanel">
      <p class="muted">Select an action</p>
    </aside>
  </main>

  <script src="../js/env.js"></script>
  <script type="module" src="../js/admin.js"></script>
</body>
</html>
